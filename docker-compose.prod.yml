version: '3.5'
services:
  postgres:
    image: postgres:15.1-alpine3.17
    container_name: nextjs_postgres_prod
    environment:
      - POSTGRES_PASSWORD
      - POSTGRES_USER
      - POSTGRES_DB
    ports:
      - 54320:5432
    volumes:
      - ./pgdata-prod:/var/lib/postgresql/data:rw
    networks:
      - nextjs-network-prod

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: nextjs_app_prod
    ports:
      - 3000:3000
    environment:
      - AUTH_DRIZZLE_URL
      - NEXTAUTH_SECRET
      - NEXTAUTH_URL
      - AUTH_SECRET
    depends_on:
      - postgres
    networks:
      - nextjs-network-prod
    command: >
      sh -c "until nc -z postgres 5432; do echo Waiting for Postgres...; sleep 2; done;
             npx drizzle-kit push --force && node server.js"

networks:
  nextjs-network-prod:
    driver: bridge
